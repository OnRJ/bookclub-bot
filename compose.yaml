services:
  postgres:
    image: postgres:16-alpine
    container_name: bookclub-postgres

    environment:
      POSTGRES_DB: ${DB_NAME:-bookclub}
      POSTGRES_USER: ${DB_USER:-bookclub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}

    ports:
      - "${DB_PORT:-5432}:5432"

    volumes:
      - bookclub_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bookclub} -d ${DB_NAME:-bookclub}"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  bookclub_data:
