services:
  backend:
    image: ghcr.io/onrj/bookclub-backend:latest
    container_name: bookclub-backend
    restart: unless-stopped
    environment:
      DB_HOST: bookclub-postgres
      DB_PORT: 5432
      DB_NAME: bookclub
      DB_USER: bookclub
      DB_PASSWORD: ${DB_PASSWORD}
      SERVER_PORT: 8080
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    networks:
      - bookclub-network

  frontend:
    image: ghcr.io/onrj/bookclub-frontend:latest
    container_name: bookclub-frontend
    restart: unless-stopped
    networks:
      - bookclub-network

  nginx:
    image: nginx:alpine
    container_name: bookclub-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./miniapp/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - bookclub-network

networks:
  bookclub-network:
    external: true